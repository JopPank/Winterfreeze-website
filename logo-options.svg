<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1250" role="img" aria-labelledby="title desc">
  <title id="title">Winterfreeze 2027 — vintage patch logo options</title>
  <desc id="desc">Five illustrated circular patch concepts featuring a snowy chalet, evergreen forest, mountains and details from the Winterfreeze weekend.</desc>
  <defs>
    <style>
      .bg { fill: #f2f6f9; }
      .card { fill: #fff; stroke: #dce5ea; stroke-width: 2; }
      .heading { fill: #17262f; font: 700 22px Arial, sans-serif; }
      .caption { fill: #6b7c87; font: 15px Arial, sans-serif; }
      .ring { fill: #10283a; stroke: #d9703a; stroke-width: 4; }
      .ring2 { fill: none; stroke: #f0dfc3; stroke-width: 2; }
      .badge-name { fill: #f7edda; font: 700 13px Arial, sans-serif; letter-spacing: 1.5px; }
      .badge-name-blue { fill: #9ed8ea; font: 700 13px Arial, sans-serif; letter-spacing: 1.5px; }
      .badge-name-orange { fill: #e8834e; font: 700 13px Arial, sans-serif; letter-spacing: 1.5px; }
      .badge-small { fill: #f7edda; font: 700 9px Arial, sans-serif; letter-spacing: 2px; }
      .pine { fill: #173d3e; stroke: #10283a; stroke-width: 1.5; stroke-linejoin: round; }
      .pine-snow { fill: #f7f1e6; stroke: #dce5e6; stroke-width: 1; stroke-linejoin: round; }
      .mountain { fill: #5d8190; stroke: #10283a; stroke-width: 2; stroke-linejoin: round; }
      .peak { fill: #f7f1e6; }
      .log { fill: #8a4d2e; stroke: #10283a; stroke-width: 3; stroke-linejoin: round; }
      .roof { fill: #f7f1e6; stroke: #10283a; stroke-width: 4; stroke-linejoin: round; }
      .wood { fill: none; stroke: #d99a63; stroke-width: 2; }
      .window { fill: #f6bf61; stroke: #10283a; stroke-width: 2; }
      .dark { fill: #10283a; }
      .cream { fill: #f7edda; }
      .orange { fill: #d9703a; }
      .ice { fill: #9ed8ea; }
      .steam { fill: none; stroke: #f7edda; stroke-width: 3; stroke-linecap: round; }
      .spark { fill: #f7edda; }
    </style>
    <g id="forest">
      <path class="pine" d="M0 0l17-29 17 29h-9l15 25H-6L9 0Z"/>
      <path class="pine-snow" d="M0 0l17-29 7 12-9-5-5 6 12 4-4 8h-9Z"/>
      <path class="dark" d="M14 25h6v18h-6z"/>
    </g>
    <g id="cabin">
      <path class="log" d="M-43-1L0-38 45-1V38H-43Z"/>
      <path class="wood" d="M-41 9h84M-41 19h84M-41 29h84M-25 3v34M-15 3v34M25 3v34M35 3v34"/>
      <path class="roof" d="M-53 0L0-47 54 0H39L0-33-39 0Z"/>
      <path class="dark" d="M19-26v-31h10v39Z"/>
      <path class="cream" d="M20-58q-9-9 0-16 8 7 3 13 13-7 17 3-7 7-14 3 2 12-7 14-7-7 1-17Z"/>
      <path class="dark" d="M-10 8v30h20V8Q0-5-10 8Z"/>
      <path class="window" d="M-35 8h12v12h-12zM24 8h12v12H24z"/>
      <path class="dark" d="M-29 8v12m-6-6h12m47-6v12m-6-6h12"/>
      <path class="orange" d="M-5 29q-5-9 1-13 0 6 5 8 3 5-2 9h-5Z"/>
    </g>
    <g id="d20">
      <path d="M0-22 20-10 17 13 0 24-20 13-18-10Z" fill="#b7a88d" stroke="#10283a" stroke-width="2"/>
      <path d="M0-22 2 1 20-10M2 1l15 12M2 1-18-10m20 11-22 12M0-22-18-10" fill="none" stroke="#10283a" stroke-width="1.5"/>
      <text x="2" y="5" text-anchor="middle" fill="#10283a" font-family="Georgia,serif" font-size="10" font-weight="700">20</text>
    </g>
    <g id="mug">
      <path d="M-14-15h26v32q-13 12-26 0Z" fill="#d9703a" stroke="#10283a" stroke-width="2"/>
      <path d="M12-8h7q8 12 0 19h-7" fill="none" stroke="#10283a" stroke-width="3"/>
      <path d="M-8-19q-5-8 2-13m8 13q-5-8 2-13" class="steam"/>
      <path d="M-8-7h14m-14 7h14" stroke="#f7edda" stroke-width="2"/>
    </g>
    <g id="burger">
      <path d="M-28 0q2-22 28-22T28 0Z" fill="#d99a63" stroke="#10283a" stroke-width="2"/>
      <path d="M-29 3h58v8h-58zm3 10h52q-3 12-26 12t-26-12Z" fill="#7b482c" stroke="#10283a" stroke-width="2"/>
      <path d="M-26 7h52" stroke="#7aa15c" stroke-width="4"/>
      <circle cx="-10" cy="-11" r="1.5" fill="#f7edda"/><circle cx="2" cy="-15" r="1.5" fill="#f7edda"/><circle cx="13" cy="-10" r="1.5" fill="#f7edda"/>
    </g>
    <g id="cards">
      <path d="M-30-15h22v35h-22zM-6-20h23v38H-6zM17-14h19v34H17z" fill="#f7edda" stroke="#10283a" stroke-width="2"/>
      <path d="M-24-8h5m-2-2v5M1-12h7m-3-3v6m17 0h6m-3-3v6" stroke="#d9703a" stroke-width="2"/>
      <path d="M-24 4q3-6 6 0-3 6-6 0Zm25 4q3-6 6 0-3 6-6 0Zm19-2q3-6 6 0-3 6-6 0Z" fill="#a4473a"/>
    </g>
    <g id="flakes" stroke="#f7edda" stroke-width="1.6" stroke-linecap="round">
      <path d="M0-6V6M-5-3L5 3M-5 3l10-6"/>
    </g>
    <g id="badge-scene">
      <path class="mountain" d="M-105 28-68-32-41 4-11-48 31 7 60-28 108 31v61h-213Z"/>
      <path class="peak" d="m-78-16 10-16 10 14-9-5-5 7Zm51-14 16-18 14 21-13-7-9 9Zm76 13 11-11 12 15-12-5-6 6Z"/>
      <path d="M-110 36q27-18 50 0 27-20 53 0 29-21 58 0 30-21 62 0v56h-223Z" fill="#dfe9e5" stroke="#10283a" stroke-width="2"/>
      <use href="#forest" transform="translate(-88 4) scale(.83)"/>
      <use href="#forest" transform="translate(82 2) scale(.88)"/>
      <use href="#forest" transform="translate(-62 22) scale(.63)"/>
      <use href="#forest" transform="translate(60 22) scale(.65)"/>
      <use href="#cabin" transform="translate(0 32) scale(.82)"/>
      <path d="M-99 91q32-16 62 0 38-18 75 0 32-16 60 0v14H-99Z" fill="#f7f1e6"/>
      <circle class="spark" cx="-43" cy="-20" r="2"/><circle class="spark" cx="40" cy="-4" r="2"/><circle class="spark" cx="60" cy="-45" r="2"/><circle class="spark" cx="-95" cy="-48" r="2"/>
    </g>
    <g id="border-sprig" fill="none" stroke="#d99a63" stroke-width="1.5" stroke-linecap="round">
      <path d="M0 0q-8-17-3-38m0 15-8-8m8 15 9-9m-8 20-9-7"/>
    </g>
  </defs>

  <rect class="bg" width="1200" height="1250"/>
  <text x="40" y="54" fill="#0f2a3d" font-family="Georgia,serif" font-size="34" font-weight="700">Winterfreeze · patch logo concepts</text>
  <text x="41" y="82" class="caption">Five illustrated directions inspired by the vintage cabin badge you shared</text>

  <!-- Option 1 -->
  <g transform="translate(30 110)">
    <rect class="card" width="560" height="370" rx="8"/>
    <text x="24" y="36" class="heading">1 · The classic chalet patch</text>
    <text x="24" y="59" class="caption">Closest to your reference: cabin, evergreens, cards, food and drink</text>
    <g transform="translate(0 22)">
      <circle class="ring" cx="142" cy="180" r="129"/><circle class="ring2" cx="142" cy="180" r="119"/>
      <text x="142" y="78" text-anchor="middle" class="badge-name">WINTERFREEZE</text>
      <g transform="translate(142 180)"><use href="#badge-scene"/></g>
      <g transform="translate(142 283) scale(.62)"><use href="#cards"/><use href="#mug" transform="translate(-71 6)"/><use href="#burger" transform="translate(73 6)"/><use href="#d20" transform="translate(0 5)"/></g>
      <text x="142" y="318" text-anchor="middle" class="badge-small">CHÉNEVILLE · 2027</text>
      <use href="#border-sprig" transform="translate(51 220) rotate(-24)"/>
      <use href="#border-sprig" transform="translate(233 220) scale(-1 1) rotate(-24)"/>
    </g>
    <text x="298" y="173" fill="#0f2a3d" font-family="Georgia,serif" font-size="25" font-weight="700">WINTERFREEZE</text>
    <text x="300" y="201" class="badge-small" fill="#6b7c87">CHALET LE SIMONET · 2027</text>
    <text x="300" y="241" class="caption">A detailed annual-trip emblem</text>
    <text x="300" y="264" class="caption">with all the weekend’s essentials.</text>
  </g>

  <!-- Option 2 -->
  <g transform="translate(610 110)">
    <rect class="card" width="560" height="370" rx="8"/>
    <text x="24" y="36" class="heading">2 · Aurora over the cabin</text>
    <text x="24" y="59" class="caption">A little more sky, moonlight and winter landscape</text>
    <g transform="translate(0 22)">
      <circle class="ring" cx="142" cy="180" r="129"/><circle class="ring2" cx="142" cy="180" r="119"/>
      <text x="142" y="78" text-anchor="middle" class="badge-name-blue">WINTERFREEZE</text>
      <clipPath id="clip2"><circle cx="142" cy="180" r="105"/></clipPath>
      <g clip-path="url(#clip2)">
        <circle cx="142" cy="180" r="105" fill="#214e69"/>
        <path d="M45 153q49-69 93-17 43-52 100-4" fill="none" stroke="#9ed8ea" stroke-width="8" opacity=".8"/>
        <path d="M48 165q46-49 91-10 50-49 98-3" fill="none" stroke="#78a98c" stroke-width="5"/>
        <circle cx="193" cy="105" r="12" fill="#f7edda"/>
        <use href="#badge-scene" transform="translate(142 151) scale(.86)"/>
        <path d="M37 261h210v36H37z" fill="#10283a"/>
        <use href="#mug" transform="translate(95 275) scale(.6)"/>
        <text x="172" y="280" text-anchor="middle" class="badge-small">3 NIGHTS · 8 FRIENDS</text>
      </g>
      <text x="142" y="318" text-anchor="middle" class="badge-small">LE SIMONET · 2027</text>
      <use href="#border-sprig" transform="translate(51 220) rotate(-24)"/>
      <use href="#border-sprig" transform="translate(233 220) scale(-1 1) rotate(-24)"/>
    </g>
    <text x="298" y="173" fill="#0f2a3d" font-family="Georgia,serif" font-size="24" font-weight="700">WINTERFREEZE</text>
    <text x="300" y="201" class="badge-small" fill="#6b7c87">NORTHERN LIGHTS EDITION</text>
    <text x="300" y="241" class="caption">Cooler and more scenic, with</text>
    <text x="300" y="264" class="caption">an aurora-lit winter sky.</text>
  </g>

  <!-- Option 3 -->
  <g transform="translate(30 500)">
    <rect class="card" width="560" height="370" rx="8"/>
    <text x="24" y="36" class="heading">3 · Eight friends at the chalet</text>
    <text x="24" y="59" class="caption">A group-focused badge with eight stars around the rim</text>
    <g transform="translate(0 22)">
      <circle class="ring" cx="142" cy="180" r="129"/><circle class="ring2" cx="142" cy="180" r="119"/>
      <text x="142" y="78" text-anchor="middle" class="badge-name-orange">WINTERFREEZE</text>
      <g transform="translate(142 180)"><use href="#badge-scene" transform="scale(.92)"/></g>
      <g fill="#f4c367" stroke="#10283a" stroke-width="1">
        <path d="m142 75 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z"/>
        <path d="m189 86 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z"/>
        <path d="m222 120 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z"/>
        <path d="m95 86 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z"/>
        <path d="m62 120 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z"/>
      </g>
      <g transform="translate(142 284) scale(.55)"><use href="#cards"/><use href="#mug" transform="translate(-71 6)"/><use href="#burger" transform="translate(73 6)"/><use href="#d20" transform="translate(0 5)"/></g>
      <text x="142" y="318" text-anchor="middle" class="badge-small">8 FRIENDS · 2027</text>
    </g>
    <text x="298" y="173" fill="#0f2a3d" font-family="Georgia,serif" font-size="25" font-weight="700">WINTERFREEZE</text>
    <text x="300" y="201" class="badge-small" fill="#6b7c87">EIGHT-POINT EDITION</text>
    <text x="300" y="241" class="caption">Stars celebrate the eight friends</text>
    <text x="300" y="264" class="caption">who make the weekend.</text>
  </g>

  <!-- Option 4 -->
  <g transform="translate(610 500)">
    <rect class="card" width="560" height="370" rx="8"/>
    <text x="24" y="36" class="heading">4 · D&amp;D by the fire</text>
    <text x="24" y="59" class="caption">Game-night details take the foreground</text>
    <g transform="translate(0 22)">
      <circle class="ring" cx="142" cy="180" r="129"/><circle class="ring2" cx="142" cy="180" r="119"/>
      <text x="142" y="78" text-anchor="middle" class="badge-name">WINTERFREEZE</text>
      <g transform="translate(142 168)"><use href="#badge-scene" transform="scale(.84)"/></g>
      <g transform="translate(96 277) scale(.72)"><use href="#cards"/></g>
      <g transform="translate(193 279) scale(.9)"><use href="#d20"/></g>
      <circle cx="142" cy="278" r="24" fill="#10283a" stroke="#d9703a" stroke-width="3"/>
      <text x="142" y="283" text-anchor="middle" fill="#f7edda" font-family="Georgia,serif" font-size="13" font-weight="700">D&amp;D</text>
      <text x="142" y="318" text-anchor="middle" class="badge-small">ROLL FOR SNOW · 2027</text>
      <use href="#border-sprig" transform="translate(51 220) rotate(-24)"/>
      <use href="#border-sprig" transform="translate(233 220) scale(-1 1) rotate(-24)"/>
    </g>
    <text x="298" y="173" fill="#0f2a3d" font-family="Georgia,serif" font-size="25" font-weight="700">WINTERFREEZE</text>
    <text x="300" y="201" class="badge-small" fill="#6b7c87">DUNGEONS &amp; SNOWFLAKES</text>
    <text x="300" y="241" class="caption">For a weekend where the campaign</text>
    <text x="300" y="264" class="caption">is as important as the cabin.</text>
  </g>

  <!-- Option 5 -->
  <g transform="translate(30 890)">
    <rect class="card" width="1140" height="330" rx="8"/>
    <text x="24" y="36" class="heading">5 · Pub night &amp; pine trees</text>
    <text x="24" y="59" class="caption">Warm, food-forward vintage colors; cabin remains the centerpiece</text>
    <g transform="translate(0 -2)">
      <circle class="ring" cx="180" cy="180" r="129"/><circle class="ring2" cx="180" cy="180" r="119"/>
      <text x="180" y="78" text-anchor="middle" class="badge-name-orange">WINTERFREEZE</text>
      <g transform="translate(180 180)"><use href="#badge-scene"/></g>
      <g transform="translate(111 282) scale(.7)"><use href="#mug"/></g>
      <g transform="translate(180 284) scale(.68)"><use href="#burger"/></g>
      <g transform="translate(249 282) scale(.7)"><use href="#mug" transform="scale(.85)"/></g>
      <path d="M149 289h62" stroke="#f7edda" stroke-width="1.5"/>
      <text x="180" y="318" text-anchor="middle" class="badge-small">CAESARS · BURGERS · 2027</text>
      <use href="#border-sprig" transform="translate(89 218) rotate(-24)"/>
      <use href="#border-sprig" transform="translate(271 218) scale(-1 1) rotate(-24)"/>
    </g>
    <text x="360" y="162" fill="#0f2a3d" font-family="Georgia,serif" font-size="34" font-weight="700">WINTERFREEZE 2027</text>
    <text x="363" y="194" class="badge-small" fill="#6b7c87">CHALET · FRIENDS · GOOD FOOD</text>
    <text x="363" y="236" class="caption">A warmer take on the badge—amber lantern light,</text>
    <text x="363" y="259" class="caption">toasty food, snowy trees, and a cozy cabin in the middle.</text>
  </g>
</svg>
